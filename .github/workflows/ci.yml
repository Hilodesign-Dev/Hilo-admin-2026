name: Deploy preview note

# Vercel Git integration is preferred for admindev.hilodesign.co.
# Connect Hilodesign-Dev/Hilo-admin-2026 in the Vercel dashboard:
#   Framework: Vite
#   Build: npm run build
#   Output: dist
#   Production branch: main
#   Env: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#   Domain: admindev.hilodesign.co
#
# This workflow only verifies the production build on push.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            export VITE_SUPABASE_URL='https://placeholder.supabase.co'
            export VITE_SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder'
          fi
          npm run build
