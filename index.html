  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet"/>
    <style>
    .material-symbols-outlined { visibility: hidden; font-feature-settings: 'liga'; }
    html.fonts-ready .material-symbols-outlined { visibility: visible; }
  </style>
  <script>
    (function () {
      var done = function () { document.documentElement.classList.add('fonts-ready') };
      if (document.fonts && document.fonts.load) {
        document.fonts.load("20px 'Material Symbols Outlined'").then(done).catch(done);
      } else {
        done();
      }
      setTimeout(done, 1500);
    })();
  </script>
